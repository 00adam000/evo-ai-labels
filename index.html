<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provenance Feed: prototype</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Provenance Feed</h1>
    <div class="topbar-right">
      <span class="proto-badge" title="Research prototype. Posts and provenance records are simulated.">Prototype · simulated data</span>
      <button id="settings-btn" class="gear" type="button" aria-label="Explanation settings" aria-expanded="false" aria-controls="settings-panel">⚙</button>
    </div>
  </header>
  <section id="settings-panel" class="settings" aria-label="Explanation settings" hidden>
    <fieldset>
      <legend>Explanations</legend>
      <label><input type="radio" name="mode" value="offline"> Offline (no AI, no key needed)</label>
      <label><input type="radio" name="mode" value="ai"> AI (Claude, needs your API key)</label>
    </fieldset>
    <div id="ai-fields">
      <label for="api-key">Anthropic API key</label>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false">
      <p class="settings-note">Your key stays in this browser tab and is sent only to Anthropic.</p>
      <label for="model">Model</label>
      <input id="model" type="text" autocomplete="off" spellcheck="false">
    </div>
  </section>
  <main id="feed" aria-live="polite">
    <p class="loading">Loading feed…</p>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
